# Build the site and deploy it to GitHub Pages (https://exynos-linux.github.io/).
# Every 6 hours too, so the prerendered device records stay fresh, and when
# a device repo's pages.yml says its records changed (repository_dispatch).
name: deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [device-records-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
